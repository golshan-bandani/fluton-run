<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fluton Run</title>
<meta name="theme-color" content="#070916">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--p:#2B63D9;--s:#1A1A1E;--a:#94B4FF;--m:#2B2B31;--bg:#101014;--f:#fff;--px:'Press Start 2P',ui-monospace,monospace;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:var(--bg);color:var(--f);font-family:var(--px);overflow:hidden;touch-action:none}
body{display:grid;place-items:center}
#g{position:relative;container-type:size;width:min(100vw,calc(100dvh*400/224));aspect-ratio:400/224;box-shadow:0 0 0 2px var(--m),0 20px 70px #2B63D955}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 25%,rgba(43,99,217,.38),rgba(16,16,20,.94));backdrop-filter:blur(3px)}
#ov.hide{display:none}
.card{display:flex;flex-direction:column;align-items:center;gap:1.3cqw;font-size:1.6cqw;line-height:1.7;max-width:74cqw}
.cat{height:27cqh;animation:fl 2.4s ease-in-out infinite;filter:drop-shadow(0 0 1.5cqw #2B63D9aa)}
@keyframes fl{50%{transform:translateY(-1.3cqh)}}
h1{font-size:5.4cqw;font-weight:400;text-shadow:.5cqw .5cqw 0 var(--p)}h1 em{color:var(--a);font-style:normal}
h2{font-size:3cqw;font-weight:400;text-shadow:.35cqw .35cqw 0 var(--p)}
.btn{font:inherit;font-size:2cqw;padding:1.3cqw 3.2cqw;background:var(--p);color:#fff;border:0;border-radius:.8cqw;box-shadow:0 .6cqw 0 #1c46a6;cursor:pointer}
.btn:hover{background:#3d74ee}.btn:active{transform:translateY(.5cqw);box-shadow:0 .1cqw 0 #1c46a6}
.ws{display:flex;gap:1cqw}
.wb{font:inherit;font-size:1.6cqw;background:var(--s);color:var(--f);border:.25cqw solid var(--m);border-radius:.8cqw;padding:.9cqw 1.2cqw;cursor:pointer;display:flex;flex-direction:column;gap:.5cqw}
.wb small{font-size:1.05cqw;color:var(--c)}.wb.on{border-color:var(--c);box-shadow:0 0 1.6cqw var(--c)}
.dim{color:#8b93a8;font-size:1.15cqw}.fact{color:var(--a);max-width:58cqw}
#tc{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;padding:0 16px;pointer-events:none}
#tc.on{display:flex}
#tc div{display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
#tc button{width:clamp(60px,17vw,84px);height:clamp(60px,17vw,84px);border-radius:50%;border:2px solid #94B4FFaa;background:rgba(26,26,30,.6);color:#fff;font:inherit;font-size:11px;touch-action:none;box-shadow:0 0 14px #2B63D966}#tc button:active{background:#2B63D9cc;transform:scale(.93)}#tc button[data-k=j]{width:clamp(72px,21vw,100px);height:clamp(72px,21vw,100px);border-color:#94B4FF;font-size:13px}

.cat.s{height:17cqh}
.btn.sm{font-size:1.4cqw;padding:1cqw 2cqw}
.btn.alt{background:var(--s);box-shadow:0 .6cqw 0 var(--m);border:.25cqw solid var(--m)}.btn.alt:hover{background:#25252b}
.ws.sb .wb{font-size:1.15cqw;padding:.8cqw 1.1cqw;flex-direction:row}
.wb[data-a]:hover,.wb[data-w]:hover{border-color:var(--a)}
.wb.lk{opacity:.4;cursor:not-allowed}.wb.lk:hover{border-color:var(--m)}
input{font:inherit;font-size:2cqw;width:36cqw;padding:1cqw 1.4cqw;background:var(--s);color:#fff;border:.3cqw solid var(--p);border-radius:.8cqw;text-align:center;outline:0;user-select:text;-webkit-user-select:text}
input:focus{border-color:var(--a)}
.lb{display:grid;grid-template-columns:3.4cqw 24cqw 11cqw 6cqw;gap:.2cqw 1.6cqw;font-size:1.3cqw;line-height:1.7;text-align:left}
.lb span:nth-child(4n+2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb span:nth-child(4n+3){text-align:right}.lb .me{color:var(--a)}
.qq{font-size:1.7cqw;max-width:66cqw}
.qo,.ow{display:grid;grid-template-columns:1fr 1fr;gap:1cqw}.qo{width:68cqw}.ow{width:56cqw}
.qo .wb{font-size:1.3cqw;line-height:1.5;text-align:center;align-items:center;justify-content:center;min-height:5.2cqw}.qo .wb:hover{border-color:var(--a)}
.ow .wb{align-items:center;text-align:center}
/* ===== Fluton Run v4: neon polish + intro + leaderboard ===== */
:root{--p:#477bff;--a:#b8a7ff;--bg:#070916;--s:#10152c;--m:#28345b}
body{background:radial-gradient(ellipse at 18% 12%,#19245a 0%,transparent 42%),radial-gradient(ellipse at 82% 85%,#27164c 0%,transparent 38%),#070916}
#g{border:1px solid #4a63c4;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px #9cafff33,0 0 36px #477bff35,0 22px 90px #080b20;isolation:isolate}
#g:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:inherit;background:linear-gradient(115deg,transparent 15%,#ffffff06 42%,transparent 68%);background-size:220% 100%;animation:screenSheen 9s linear infinite}
#ov{display:flex;align-items:flex-start;justify-content:flex-start;overflow:auto;touch-action:pan-y;padding:1.6cqw;background:radial-gradient(ellipse at 50% 0%,#436dff3b,transparent 58%),linear-gradient(135deg,#090d20ee,#090916f5);backdrop-filter:blur(9px)}
.card{margin:auto;width:min(96%,74cqw);max-width:none;padding:1.5cqw 2.4cqw;gap:1cqw;border:1px solid #a8baff45;border-radius:2cqw;background:linear-gradient(145deg,#182345ef,#0a1025f5);box-shadow:0 18px 55px #0008,0 0 28px #426cff16,inset 0 1px #ffffff10;animation:cardArrival .48s cubic-bezier(.2,.8,.2,1) both}
h1{font-size:4.8cqw}h2{font-size:2.6cqw}.cat.s{height:12.5cqh}.dim{font-size:1cqw}.ws.sb .wb{font-size:1.05cqw}.card .wb[data-w]{font-size:1.4cqw;padding:.7cqw 1cqw}
h1,h2{text-shadow:0 0 22px #6689ff65,.12em .12em 0 #3432a0}
h1 em{color:#b9a7ff;text-shadow:0 0 20px #8e73ffb0}
.btn{position:relative;overflow:hidden;background:linear-gradient(115deg,#377dff,#6651ed 55%,#8c59f5);border:1px solid #c0d3ff70;border-radius:1.1cqw;box-shadow:0 .5cqw 0 #292a83,0 0 22px #4b65ff35;transition:transform .16s,filter .16s,box-shadow .16s}
.btn:hover{filter:brightness(1.16);transform:translateY(-1px)}
.btn:active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 #292a83}
.btn.alt{background:#10152c;border:1px solid #3a4c85;box-shadow:0 .5cqw 0 #1b2447}.btn.alt:hover{background:#18214a}
.wb{background:#101a31;border:1px solid #31476f;border-radius:1cqw;transition:border-color .16s,background .16s,transform .16s;backdrop-filter:blur(8px)}
.wb:hover{border-color:#8fa7ff;background:#1b2850;transform:translateY(-1px)}
.wb.lk,.wb.lk:hover{opacity:.38;filter:grayscale(1);transform:none;border-color:#31476f}
.pill{display:inline-block;padding:.5cqw 1.1cqw;border:1px solid #5b83d8;border-radius:99px;color:#b7d9ff;font-size:.95cqw;letter-spacing:.06em;background:#426cff20;box-shadow:0 0 16px #426cff20}
.cat{filter:drop-shadow(0 0 12px #6488ff88);animation:mascotFloat 2.5s ease-in-out infinite}
.dim{color:#aab9d8}.fact{color:#a9d9ff}
input{background:#081126;border:1px solid #4264a4;border-radius:1cqw}
@keyframes mascotFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
@keyframes cardArrival{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes screenSheen{0%{background-position:180% 0}100%{background-position:-40% 0}}
@media(max-width:520px){#g{width:100vw;border-radius:0}}

/* ---- leaderboard ---- */
.lbw{width:100%;display:grid;gap:.4cqw}
.lh,.lr{display:grid;grid-template-columns:3.6cqw 1fr 9cqw 10.5cqw;align-items:center;gap:1.2cqw;text-align:left}
.lh{font-size:.95cqw;color:#8b9cc8;padding:0 1.4cqw}.lh span:last-child,.lr .sc{text-align:right}
.lr{padding:.4cqw 1.4cqw;border-radius:1cqw;background:#10162e;border:1px solid #28345b;font-size:1.25cqw;animation:rowIn .45s both;animation-delay:calc(var(--i)*70ms)}
.lr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .nm em{font-style:normal;font-size:.9cqw;color:#0a1025;background:var(--a);border-radius:.5cqw;padding:.15cqw .5cqw;margin-left:.6cqw;vertical-align:middle}
.lr .rk{display:grid;place-items:center;width:2.3cqw;height:2.3cqw;border-radius:50%;background:#1b2750;color:#c9d6ff;font-weight:400;font-size:1.15cqw}
.lr.g1{border-color:#ffd25a;background:linear-gradient(90deg,#ffd25a22,#10162e 60%)}.lr.g1 .rk{background:#ffd25a;color:#2a1c00}
.lr.g2{border-color:#cfd8e8;background:linear-gradient(90deg,#cfd8e820,#10162e 60%)}.lr.g2 .rk{background:#cfd8e8;color:#1b2230}
.lr.g3{border-color:#e08a4a;background:linear-gradient(90deg,#e08a4a22,#10162e 60%)}.lr.g3 .rk{background:#e08a4a;color:#2a1200}
.lr.me{box-shadow:0 0 0 1px var(--a),0 0 18px #8e73ff55}
.pips{display:flex;gap:.35cqw}.pips i{width:1cqw;height:1cqw;border-radius:.25cqw;background:#222d52}.pips i.on{background:var(--c);box-shadow:0 0 .8cqw var(--c)}
.myrank{font-size:1.2cqw;color:var(--a)}
@keyframes rowIn{from{opacity:0;transform:translateX(3cqw)}to{opacity:1;transform:none}}

/* ---- intro ---- */
#intro{position:absolute;inset:0;z-index:30;overflow:hidden;background:#04050d;cursor:pointer;font-family:var(--px);color:#fff;transition:opacity .4s}
#intro.out{opacity:0;pointer-events:none}
#intro *{position:absolute;box-sizing:border-box}
#intro .in-sky{inset:0;background:radial-gradient(ellipse 70% 60% at 50% 28%,#22358a77,transparent 70%),radial-gradient(ellipse 40% 30% at 88% 88%,#4a2290aa,transparent 70%),linear-gradient(#05060f,#0a1030 62%,#070916);animation:inFade .8s both}
#intro .st{width:.4cqw;height:.4cqw;border-radius:50%;background:#cfdcff;animation:inTw 2.4s ease-in-out infinite}
#intro .in-hz{left:0;right:0;top:62cqh;height:.35cqh;background:linear-gradient(90deg,transparent,#7f9cff,#b8a7ff,#7f9cff,transparent);box-shadow:0 0 3cqw #5b7dff;animation:inHz 1s .2s both}
#intro .in-floor{left:-60cqw;right:-60cqw;top:62cqh;height:140cqh;transform-origin:50% 0;transform:perspective(46cqw) rotateX(-72deg);background:repeating-linear-gradient(90deg,#6b8cff66 0 .3cqw,transparent .3cqw 7cqw),repeating-linear-gradient(0deg,#6b8cff66 0 .3cqw,transparent .3cqw 7cqw);-webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%);animation:inGrid 1.1s linear infinite,inFade .8s .2s both}
#intro .in-beam{top:0;height:100%;width:56cqw;left:22cqw;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);background:linear-gradient(#b9c8ff55,#6b8cff14 75%,transparent);opacity:0;animation:beamA 1s 1s both,beamB .8s 3.9s both}
#intro .in-kick{top:8cqh;left:0;right:0;text-align:center;font-size:1.7cqw;letter-spacing:.7cqw;color:#a9bcff;text-shadow:0 0 14px #5b7dff;animation:inKick 3s .5s both}
#intro .cw{bottom:6cqh;aspect-ratio:var(--ar);opacity:0;filter:drop-shadow(0 0 .22cqw #c4d1ff) drop-shadow(0 0 1.8cqw #4a6bffcc)}
#intro .cw img{position:relative;width:100%;height:100%;display:block;transform-origin:50% 96%}
#intro .cw.side{height:60cqh;--ar:319/560;left:40cqw;animation:sideIn 1.5s 1s cubic-bezier(.2,.8,.2,1) both,sideOut .25s 3.95s ease-in forwards}
#intro .cw.side img{animation:inBob .3s ease-in-out 1s 5 alternate,inBow 1.15s ease-in-out 2.5s 1}
#intro .cw.front{height:80cqh;--ar:316/720;left:19cqw;animation:frontIn .7s 4s cubic-bezier(.2,.9,.2,1) both,frontOut .2s 7.4s forwards}
#intro .cw.front img{animation:inBreath 2.6s ease-in-out 4.7s infinite}
#intro .cw.back{height:57cqh;--ar:253/560;left:21.6cqw;transform-origin:50% 100%;animation:backIn .25s 7.35s both,backWalk 1.25s 7.6s cubic-bezier(.5,0,.8,.6) forwards}
#intro .cw.back img{animation:inStep .32s ease-in-out 7.6s 4 alternate}
#intro .sh{left:50%;bottom:-1.2cqh;width:90%;height:6cqh;margin-left:-45%;background:radial-gradient(ellipse,#000c,transparent 70%)}
#intro .sp{width:1.6cqw;height:1.6cqw;background:#fff;transform:rotate(45deg) scale(0);box-shadow:0 0 1.2cqw #9db4ff;animation:inSpark .7s var(--d) both}
#intro .ring{left:48.4%;top:8.6%;width:1cqw;height:1cqw;margin:-.5cqw 0 0 -.5cqw;border:.22cqw solid #d9e5ff;border-radius:50%;opacity:0;animation:inRing 1.8s var(--d) ease-out infinite}
#intro .glow{left:48.4%;top:8.6%;width:5cqw;height:5cqw;margin:-2.5cqw 0 0 -2.5cqw;border-radius:50%;background:radial-gradient(#fff,#8fa9ff88 40%,transparent 70%);opacity:0;animation:inGlow 2s 4.1s ease-in-out infinite}
#intro .bub{left:63cqw;top:28cqh;padding:1.3cqw 1.7cqw;border:1px solid #a8baff77;border-radius:1.4cqw;background:linear-gradient(145deg,#182345ee,#0a1025f2);box-shadow:0 0 2cqw #4b65ff44;font-size:1.3cqw;line-height:1.9;opacity:0;animation:bubA .35s 2.6s both,bubB .25s 3.85s forwards}
#intro .bub:before{content:"";left:-1cqw;top:3cqw;width:1.6cqw;height:1.6cqw;background:#152043;border-left:1px solid #a8baff77;border-bottom:1px solid #a8baff77;transform:rotate(45deg)}
#intro .bub span{position:relative;display:block;white-space:nowrap;overflow:hidden;width:0;animation:inType var(--w) steps(var(--n)) var(--d) forwards}
#intro .bub span+span{color:#b9a7ff}
#intro .in-tb{left:50cqw;width:46cqw;top:25cqh;text-align:center;animation:tbUp .6s 5.7s cubic-bezier(.3,.8,.3,1) both}
#intro .in-tb .row{position:relative;display:flex;justify-content:center;font-size:6.6cqw;line-height:1.15;letter-spacing:-.2cqw;text-shadow:0 0 2.2cqw #6689ff,.35cqw .35cqw 0 #3432a0}
#intro .in-tb .row.r2{color:#b9a7ff;text-shadow:0 0 2.2cqw #8e73ff,.35cqw .35cqw 0 #3432a0}
#intro .in-tb .L{position:relative;display:block;opacity:0;animation:inDrop .5s var(--d) cubic-bezier(.2,1.5,.4,1) both,inGlitch 5s 6s infinite}
#intro .in-sub{position:relative;margin-top:1.4cqh;font-size:1.05cqw;letter-spacing:.14cqw;color:#a9d9ff;white-space:nowrap;opacity:0;animation:inFade .6s 5.1s both}
#intro .in-lb{left:51cqw;width:44cqw;top:53cqh;opacity:0;animation:inFade .4s 5.8s both}
#intro .in-lb .hd{position:relative;font-size:1.1cqw;letter-spacing:.2cqw;color:#8fa7ff;text-align:center;margin-bottom:1cqh}
#intro .in-lb .rw{position:relative;display:grid;grid-template-columns:3cqw 1fr auto;gap:1cqw;align-items:center;padding:.7cqw 1.3cqw;margin-bottom:.8cqh;border:1px solid #28345b;border-radius:1cqw;background:#10162ecc;font-size:1.25cqw;opacity:0;animation:rowIn .45s var(--d) both}
#intro .in-lb .rw *{position:static}
#intro .in-lb .rw b{display:grid;place-items:center;width:2.4cqw;height:2.4cqw;border-radius:50%;font-weight:400;font-size:1.05cqw;background:#ffd25a;color:#2a1c00}
#intro .in-lb .rw.n2 b{background:#cfd8e8;color:#1b2230}#intro .in-lb .rw.n3 b{background:#e08a4a;color:#2a1200}
#intro .in-lb .rw.n1{border-color:#ffd25a}
#intro .in-lb .rw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
#intro .in-lb .rw u{text-decoration:none;color:#b9a7ff}
#intro .in-lb .tag{position:relative;text-align:center;font-size:1.15cqw;line-height:1.9;color:#a9d9ff}
#intro .portal{left:28.8cqw;top:50cqh;width:12cqw;height:12cqw;margin:-6cqw 0 0 -6cqw;border-radius:50%;border:.5cqw solid #d9e5ff;background:radial-gradient(circle,#fff 0,#9db4ff 35%,#6651ed66 62%,transparent 70%);box-shadow:0 0 4cqw #7f9cff,inset 0 0 3cqw #fff;opacity:0;transform:scale(0);animation:inPortal .9s 7.4s cubic-bezier(.2,.8,.2,1) both}
#intro .in-flash{inset:0;background:#dfe8ff;opacity:0;animation:inFlash .5s 3.85s ease-out both}
#intro .in-flash2{left:28.8cqw;top:55cqh;width:10cqw;height:10cqw;margin:-5cqw 0 0 -5cqw;border-radius:50%;background:radial-gradient(circle,#fff,#b8c8ff 45%,#6b8cff 70%);opacity:0;transform:scale(0);animation:inFlash2 .75s 8.55s cubic-bezier(.6,0,.9,.5) forwards}
#intro .in-skip{right:1.6cqw;bottom:1.4cqh;padding:.8cqw 1.3cqw;font:inherit;font-size:1cqw;letter-spacing:.1cqw;color:#c8d6ff;background:#0a1025aa;border:1px solid #4a63c4;border-radius:.9cqw;opacity:0;animation:inFade .5s .6s both;z-index:5}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes inTw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes inHz{from{opacity:0;transform:scaleX(.1)}to{opacity:1;transform:none}}
@keyframes inGrid{to{background-position:0 7cqw,0 7cqw}}
@keyframes inKick{0%{opacity:0;letter-spacing:2cqw}20%,80%{opacity:1;letter-spacing:.7cqw}100%{opacity:0}}
@keyframes beamA{from{opacity:0}to{opacity:1}}
@keyframes beamB{from{left:22cqw}to{left:.8cqw}}
@keyframes sideIn{0%{opacity:0;transform:translateX(-60cqw)}8%{opacity:1}100%{opacity:1;transform:translateX(0)}}
@keyframes sideOut{to{opacity:0;transform:translateX(0) scale(.96)}}
@keyframes inBob{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-1.6cqh) rotate(1.5deg)}}
@keyframes inBow{0%,100%{transform:rotate(0)}45%,60%{transform:rotate(7deg) translateY(.8cqh)}}
@keyframes inSpark{0%{transform:rotate(45deg) scale(0);opacity:1}50%{transform:rotate(135deg) scale(1);opacity:1}100%{transform:rotate(225deg) scale(0);opacity:0}}
@keyframes frontIn{0%{opacity:0;transform:scale(.82) translateY(3cqh)}100%{opacity:1;transform:none}}
@keyframes frontOut{to{opacity:0}}
@keyframes inBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.99)}}
@keyframes inRing{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(14)}}
@keyframes inGlow{0%,100%{opacity:.25}50%{opacity:.95}}
@keyframes bubA{from{opacity:0;transform:scale(.8) translateX(-1cqw)}to{opacity:1;transform:none}}
@keyframes bubB{to{opacity:0}}
@keyframes inType{from{width:0}to{width:100%}}
@keyframes inDrop{0%{opacity:0;transform:translateY(-14cqh) scale(1.5)}100%{opacity:1;transform:none}}
@keyframes inGlitch{0%,93%,100%{transform:none;filter:none}94%{transform:translateX(.5cqw);filter:hue-rotate(60deg)}96%{transform:translateX(-.5cqw) skewX(-8deg)}98%{transform:translateX(.2cqw)}}
@keyframes tbUp{to{transform:translateY(-15cqh)}}
@keyframes backIn{from{opacity:0}to{opacity:1}}
@keyframes backWalk{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:1;transform:translate(0,-27cqh) scale(.2)}}
@keyframes inStep{from{transform:translateY(0) rotate(-1.2deg)}to{transform:translateY(-1.4cqh) rotate(1.2deg)}}
@keyframes inPortal{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
@keyframes inFlash{0%{opacity:0}18%{opacity:.8}100%{opacity:0}}
@keyframes inFlash2{0%{opacity:0;transform:scale(0)}15%{opacity:1}100%{opacity:1;transform:scale(30)}}

.lkt{font-size:5cqw;color:#ffd166;text-shadow:0 0 16px #ffb03a88;margin:.5cqw 0}
